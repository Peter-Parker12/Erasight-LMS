services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erasight_lms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "3749:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending Prisma migrations, then exits. `web` won't
  # start until this completes successfully — a single `docker compose up`
  # brings up db -> migrate -> web in order, with no manual migration step.
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    env_file: .env
    restart: unless-stopped
    # The app itself. Bound to 127.0.0.1 only — public HTTPS/domain routing
    # is handled by Cloudflare Tunnel (cloudflared), which runs separately
    # (not part of this compose stack) and connects to this port locally.
    # There's no reverse proxy in this stack anymore: the VPS doesn't need
    # any inbound port open to the public internet for this app at all.
    # Point your cloudflared config's ingress at http://localhost:5895.
    ports:
      - "127.0.0.1:5895:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    # Compose-network-only — no `ports:` mapping. Unlike `db`/`web`, this
    # service is never bound to a host interface at all, so it isn't reachable
    # via <vps-ip>:<port> even if the firewall is misconfigured. `web` reaches
    # it over the internal network at http://storage:9000; the browser never
    # talks to it directly (see /api/uploads and /api/files/[...key]).
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the bucket, then exits. Left at MinIO's default
  # private ACL — reads now go through the authenticated /api/files proxy
  # (see lib/s3.ts), not a public bucket policy.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-erasight-lms}
    restart: "no"

volumes:
  pgdata:
  miniodata:
