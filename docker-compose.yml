services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erasight_lms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "3749:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: installs the Moodle schema + admin account into the `db`
  # service above (same Postgres database as before, just a distinct
  # `mdl_`-prefixed set of tables — no new database/credentials needed) and
  # configures outgoing mail. Safe to re-run on every `docker compose up` —
  # same "no manual step" pattern the old Prisma `migrate` service used.
  moodle-install:
    build: .
    user: www-data
    entrypoint: ["/usr/local/bin/install-database.sh"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - moodledata:/var/moodledata
    restart: "no"

  moodle:
    build: .
    restart: unless-stopped
    env_file: .env
    # Bound to 127.0.0.1 only — same posture the Next.js app used. Public
    # access is via Cloudflare Tunnel (cloudflared, run separately on the
    # VPS, not part of this compose file); its ingress already points at
    # http://localhost:5895, so nothing changes there.
    ports:
      - "127.0.0.1:5895:80"
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      db:
        condition: service_healthy
      moodle-install:
        condition: service_completed_successfully

  # Moodle needs admin/cli/cron.php run roughly every minute for scheduled
  # tasks/notifications — there's no other process to piggyback this on the
  # way the old `web` service didn't need a separate cron container.
  moodle-cron:
    build: .
    user: www-data
    entrypoint: ["/usr/local/bin/cron-loop.sh"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - moodledata:/var/moodledata
    depends_on:
      moodle:
        condition: service_started

volumes:
  pgdata:
  moodledata:
